# 게임 페이지를 캐시하지 않게 한다.
#
# 소스를 고쳤는데 브라우저가 옛 파일을 들고 있으면, JS 는 새것인데 HTML 은 옛것이라
# 있어야 할 요소가 없어서 addEventListener 가 null 에서 터진다. 실제로 그렇게 한 번 막혔다.
# 매번 Ctrl+F5 를 기억하는 것보다 서버가 캐시하지 말라고 하는 편이 확실하다.

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    add_header Cache-Control "no-store, must-revalidate" always;
    etag off;
    if_modified_since off;

    location / {
        try_files $uri $uri/ =404;
    }
}
