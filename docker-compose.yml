# 몰리 서버 한 방에 띄우기
#
# 도커에 올릴 수 있는 것과 없는 것이 갈린다.
#
#   web    - 게임 페이지. 들어가면 게임(뱀서/농부)부터 고른다.
#            항상 떠 있는 게 편해서 restart: unless-stopped 를 준다.
#   ollama - 레벨업 판단용 LLM. GPU를 그대로 넘겨받는다.
#   브릿지 - 도커 불가. 컨테이너 안에서는 호스트 윈도우 데스크톱에 키를 보낼 수 없다.
#            윈도우는 세션이 격리돼 있어서 다른 세션의 창에 입력을 넣지 못한다.
#            그래서 브릿지만 호스트에서 돈다 (start.ps1 이 대신 띄워준다).

services:
  web:
    image: nginx:alpine
    container_name: molli-web
    ports:
      # 이 PC 에서만 연다. 그냥 "8743:80" 이면 같은 와이파이의 누구나 페이지를 열 수 있다.
      # 폰으로 보려면 페이지가 아니라 브릿지의 '폰으로 보기' 창구(8745, 등록한 기기만)를 쓴다.
      - "127.0.0.1:8743:80"
    volumes:
      # 읽기 전용으로 붙인다. 소스를 고치면 새로고침만 하면 되고, 컨테이너를 다시 만들 필요가 없다.
      - ./game:/usr/share/nginx/html:ro
      # 캐시를 끈다. 안 그러면 JS 는 새것인데 HTML 은 브라우저가 들고 있던 옛것이라
      # 있어야 할 요소가 없어서 터진다 (실제로 겪었다).
      - ./docker/nginx-nocache.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  # 기본으로는 뜨지 않는다 (profiles). 윈도우에 설치된 네이티브 Ollama가 이미 11434를
  # 쓰고 있어서 둘을 같이 띄우면 포트가 충돌하기 때문이다.
  #
  # 도커 쪽으로 갈아타려면:
  #   1) 네이티브 Ollama 종료 (트레이 아이콘 → Quit)
  #   2) docker compose --profile ollama up -d
  #   3) .\import-models.ps1        ← 받아둔 모델을 볼륨으로 복사 (다시 받지 않는다)
  #
  # 3번을 빼먹으면 볼륨이 비어 있어서 페이지에 "모델 없음"이 뜬다. 네이티브에 있던
  # 모델은 저장 위치가 달라서 그냥은 따라오지 않는다.
  #
  # 모델은 이름 있는 볼륨에 둔다. 윈도우 폴더를 그대로 붙이면 WSL2가 9p로 읽어서
  # 7.6GB 모델을 올릴 때 눈에 띄게 느려진다.
  ollama:
    image: ollama/ollama
    container_name: molli-ollama
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    gpus: all
    restart: unless-stopped

volumes:
  ollama-models:
